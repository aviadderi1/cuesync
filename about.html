<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>About — Cue Sync</title>
<style>
  :root{
    --bg:#12151a; --line:#242a33; --text:#ece9e2; --muted:#8891a0; --cyan:#45d6c0; --amber:#f2a94e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .wrap{padding:26px;text-align:center;}
  .mark{
    width:64px;height:64px;border-radius:16px;margin:0 auto 14px;
    display:block;object-fit:cover;
  }
  h1{font-size:16px;margin:0 0 4px;font-weight:800;}
  .version{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:18px;}
  .desc{font-size:12px;color:var(--text);line-height:1.7;margin-bottom:16px;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .meta{font-size:10.5px;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="icon.png" alt="Cue Sync">
    <h1>Cue Sync</h1>
    <div class="version" id="versionLine">Version …</div>
    <div class="desc">
      A professional stage playback and MIDI Show Control tool for live dance
      performances — multi-track audio, cue timelines, and MSC/MIDI output to
      grandMA lighting consoles.
    </div>
    <div class="divider"></div>
    <div class="meta">
      Developer – AD Sound &amp; Lighting (C)
    </div>
  </div>
<script>
  window.aboutAPI.getInfo().then((info)=>{
    if(!info) return;
    document.getElementById('versionLine').textContent = 'Version ' + info.version;
  });
</script>
</body>
</html>
