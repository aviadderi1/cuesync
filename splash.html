<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cue Sync</title>
<style>
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:transparent;
    overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .logo-wrap{
    position:relative; width:220px; height:220px; flex-shrink:0;
    animation: splashFadeIn .5s ease-out;
  }
  .logo-img{
    width:100%; height:100%; display:block;
    -webkit-user-drag:none;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
    animation: logoSpin 3.2s cubic-bezier(.4,0,.2,1) infinite;
    transform-style: preserve-3d;
  }
  @keyframes splashFadeIn{
    from{ opacity:0; transform:scale(.92); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes logoSpin{
    0%   { transform: rotateY(0deg); }
    45%  { transform: rotateY(360deg); }
    100% { transform: rotateY(360deg); }
  }
  /* Colored spotlight glow, positioned over the beam area, cycling hue —
     the logo itself is a single flattened image with no separate layer
     for the spotlight, so this overlay is how it "changes color" without
     touching the artwork. */
  .spot-glow{
    position:absolute; top:18px; right:32px; width:80px; height:80px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.9) 0%, transparent 70%);
    mix-blend-mode:screen;
    animation: hueCycle 4s linear infinite, glowPulse 1.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes hueCycle{
    0%{ filter:hue-rotate(0deg) saturate(1.8); }
    100%{ filter:hue-rotate(360deg) saturate(1.8); }
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:.9; transform:scale(1.15); }
  }

  .loading-wrap{
    width:190px; margin-top:22px; flex-shrink:0;
    animation: splashFadeIn .5s ease-out .15s backwards;
  }
  .loading-track{
    width:100%; height:6px; border-radius:6px; background:#1a1a1a;
    border:1px solid #2a2a2a; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
  }
  .loading-fill{
    height:100%; width:0%; border-radius:6px;
    background:linear-gradient(90deg, #a3841f, #ffd77a, #a3841f);
    background-size:200% 100%;
    box-shadow:0 0 8px rgba(255,200,80,.6);
    animation: fillBar 10s linear forwards, shimmer 1.4s linear infinite;
  }
  @keyframes fillBar{ from{ width:0%; } to{ width:100%; } }
  @keyframes shimmer{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }
  .loading-label{
    margin-top:8px; text-align:center; font-size:9.5px; letter-spacing:2px;
    color:#a3841f; font-weight:700; font-family:'Courier New',monospace;
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <img class="logo-img" src="splash-logo.png" alt="Cue Sync">
    <div class="spot-glow"></div>
  </div>
  <div class="loading-wrap">
    <div class="loading-track"><div class="loading-fill"></div></div>
    <div class="loading-label">LOADING</div>
  </div>
</body>
</html>
