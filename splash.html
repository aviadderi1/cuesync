<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cue Sync</title>
<style>
  /* Fully transparent window: only the artwork square is visible, with no
     backdrop, no spinner and no progress bar. */
  html,body{
    margin:0; height:100%; width:100%;
    background:transparent;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  .logo-img{
    width:min(92vw, 92vh);
    height:auto;
    display:block;
    image-rendering:-webkit-optimize-contrast;
    animation: splashIn .45s ease-out;
  }
  @keyframes splashIn{
    from{ opacity:0; transform:scale(.97); }
    to{ opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>
  <img class="logo-img" src="splash-logo.png" alt="Cue Sync">
</body>
</html>
